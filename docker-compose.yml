services:
  app:
    image: draftdle
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_TG_BOT_NAME=${TG_BOT_NAME:-}
    container_name: draftdle
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./backend/data:/app/data
    networks:
      - draftdle-network

networks:
  draftdle-network:
    driver: bridge
